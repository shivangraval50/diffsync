name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # vendor/openbid carries @openbid/llm, which is a workspace here.
          # Without this the root `npm ci` cannot resolve that workspace and
          # every step below fails with an unhelpful workspace error.
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck --workspace @diffsync/pr-do
      - run: npm run typecheck --workspace @diffsync/web
      - run: npm test
      - run: npm run build --workspace @diffsync/web
        env:
          PRS_BASE_URL: http://127.0.0.1:8787
          NEXT_PUBLIC_PRS_BASE_URL: http://127.0.0.1:8787

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          PRS_BASE_URL: http://127.0.0.1:8787
          NEXT_PUBLIC_PRS_BASE_URL: http://127.0.0.1:8787
          AUTH_SECRET: ci-not-a-real-secret
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          # The HTML report plus test-results/, which is where
          # trace: "retain-on-failure" writes its per-test traces. The report
          # links to those paths, so uploading only one half leaves its trace
          # links dead.
          path: |
            apps/web/playwright-report
            apps/web/test-results
