name: deploy-worker
on:
  push:
    branches: [main]
    # `packages/**`, not `packages/pr-do/**`: the Worker bundles
    # @diffsync/anchor, @diffsync/diff, @diffsync/fixtures, @diffsync/protocol
    # and @diffsync/threads, so a change to any of them changes what is
    # deployed. Narrowing this filter would silently ship a stale Worker.
    paths: ["packages/**"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # vendor/openbid is a workspace of this repo. The Worker itself does
          # not import @openbid/llm, but the root `npm ci` below cannot resolve
          # the workspace list without it.
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx wrangler deploy
        working-directory: packages/pr-do
        env:
          # Repository secret. Needs the "Edit Cloudflare Workers" template, or
          # at minimum Account > Workers Scripts: Edit.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
